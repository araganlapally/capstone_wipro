spring.application.name=nutrition-service

# Disable Config Server for tests
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:8888

# MySQL test database
spring.datasource.url=jdbc:mysql://localhost:3306/nutritiondb_test
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT - test values only
jwt.secret=mytestsecretkeymytestsecretkeymytestsecretkey
jwt.expiration=3600000

# Feign URLs
ai.service.url=http://localhost:8084
user.service.url=http://localhost:8081

# Disable unnecessary cloud/discovery behavior during tests
spring.cloud.openfeign.enabled=true